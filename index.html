<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Gospell Lab</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --text-muted: #b0b0b0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .player-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }
        .status {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .track-info {
            font-size: 1.1rem;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .radio-ticker-box {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>Estação Gospel Lab</h1>
        <div id="radio-status" class="status">CARREGANDO...</div>
        <div id="track-title" class="track-info">Conectando à programação...</div>
        
        <audio id="audio-player" controls></audio>
        
        <div id="radio-mensagens-container" class="radio-ticker-box"></div>
    </div>

    <script>
        let playlistTracks = [];
        let currentIndex = 0;
        const audioPlayer = document.getElementById('audio-player');
        const statusEl = document.getElementById('radio-status');
        const titleEl = document.getElementById('track-title');

        async function parsePlaylistJSON(url) {
            try {
                const response = await fetch(url + "?t=" + new Date().getTime());
                const data = await response.json();
                
                let result = [];
                if (data.sequence && data.catalog) {
                    for (let id of data.sequence) {
                        const track = data.catalog[id];
                        if (track) {
                            result.push(track);
                        }
                    }
                }
                return result;
            } catch (error) {
                console.error("Erro ao carregar playlist:", error);
                return [];
            }
        }

        async function initRadioData() {
            statusEl.textContent = "CARREGANDO...";
            playlistTracks = await parsePlaylistJSON('playlist.json');
            
            if (playlistTracks.length > 0) {
                statusEl.textContent = "AO VIVO";
                currentIndex = 0;
                playTrack(currentIndex);
            } else {
                statusEl.textContent = "ERRO NA PLAYLIST";
                titleEl.textContent = "Não foi possível carregar as faixas.";
            }
        }

        function playTrack(index) {
            if (index >= playlistTracks.length) {
                currentIndex = 0; // Loop infinito da grade
            }
            const track = playlistTracks[currentIndex];
            titleEl.textContent = track.title ? track.title : "Tocando Vinheta / Intervalo";
            audioPlayer.src = track.url;
            audioPlayer.play().catch(e => {
                console.log("Autoplay bloqueado pelo navegador, aguardando interação.", e);
            });
        }

        audioPlayer.addEventListener('ended', () => {
            currentIndex++;
            playTrack(currentIndex);
        });

        function carregarAvisos() {
            // Espaço reservado para avisos futuros
        }

        function carregarTextoSobre() {
            // Espaço reservado para texto sobre
        }

        document.addEventListener("DOMContentLoaded", () => {
            carregarAvisos();
            carregarTextoSobre();
            initRadioData();
        });
    </script>
</body>
</html>
